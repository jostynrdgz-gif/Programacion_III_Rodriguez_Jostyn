<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia</title>
</head>
<body>
    <h1>Multimedia</h1>
    <h2>Reproducir sonido</h2>
    <audio id="musica" src="music/music_demo.mp3" controls
    controls
    autoplay
    muted
    loop>tu navegador no soporta el elemento audio</audio>

    <video src="video/video.mp4" controls width="500">Tu navegador no soporta el elemento video</video>
    <h1>Reproducir video</h1>
    <h2>El nuevo Youtube</h2>
    <inframe src="https://www.youtube.com/watch?v=Zifr_c0dTlc"
    width="560"
    height="315"
    title="YouTube video player"
    loading="lazy"></inframe>
</body>
</html>
