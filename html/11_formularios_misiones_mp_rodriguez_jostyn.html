<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puntos FOUNDSHOEZ</title>
</head>
<body>

    <header>
        <h1>FOUNDSHOEZ</h1>
        <p>Completa misiones, acumula puntos y desbloquea cupones de descuento exclusivos</p>
    </header>
    <hr>
    <main>
        <form action="#" method="post" id="registro-misiones-puntos">
            
            <fieldset>
                <legend>Crear usuario (+100 Puntos)</legend>

                <label for="username">
                    Nombre de usuario:
                </label>
                <input type="text"
                       id="username"
                       name="username"
                       placeholder="Ej: rdgzzz"
                       maxlength="20"
                       required>
                <br><br>

                <label for="email">
                    Correo electronico:
                </label>
                <input type="email"
                       id="email"
                       name="email"
                       placeholder="pepetola@correo.com"
                       required>
                <br><br>

                <label for="password">
                    Contraseña de acceso:
                </label>
                <input type="password"
                       id="password"
                       name="password"
                       minlength="6"
                       placeholder="Minimo 6 caracteres"
                       required>
                <br><br>

                <label for="confirm-password">
                    Confirmar contraseña:
                </label>
                <input type="password"
                       id="confirm-password"
                       name="confirm_password"
                       minlength="6"
                       placeholder="Minimo 6 caracteres"
                       required>
            </fieldset>

            <br>

            <fieldset>
                <legend>Registro de misiones completadas</legend>

                <p>Mision principal cumplida en tienda o calle:</p>
                <input type="radio"
                       id="mision-unbox"
                       name="mision_principal"
                       value="video_unboxing"
                       required>
                <label for="mision-unbox">
                    Grabar unboxing y review en video en Instagram (+300 pts)
                </label>
                <br>

                <input type="radio"
                       id="mision-trick"
                       name="mision_principal"
                       value="video_truco">
                <label for="mision-trick">
                    Publicar truco o sesion de fotos usando tus zapatillas de la tienda (+450 pts)
                </label>
                <br><br>

                <label for="compras-mes">
                    Compras realizadas este mes:
                </label>
                <input type="number"
                       id="compras-mes"
                       name="compras_mes"
                       min="1"
                       max="10"
                       value="1">
                <br><br>
            </fieldset>
    <hr>
    <footer>
    <p>
         <small>
             FOUNDSHOEZ - 2026
         </small>
    </p>
    </footer>

</body>
</html>
